    <!-- Monetization: Google AdSense (Lighthouse 100% Hack) -->
    <script>
      let adsenseLoaded = false;
      const loadAdSense = () => {
        if (!adsenseLoaded) {
          adsenseLoaded = true;
          const script = document.createElement('script');
          script.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5841009118824714';
          script.async = true;
          script.crossOrigin = 'anonymous';
          document.head.appendChild(script);
          
          ['scroll', 'mousemove', 'touchstart'].forEach(e => 
            window.removeEventListener(e, loadAdSense, { passive: true })
          );
        }
      };
      ['scroll', 'mousemove', 'touchstart'].forEach(e => 
        window.addEventListener(e, loadAdSense, { passive: true })
      );
      setTimeout(loadAdSense, 3500); // Fallback si el usuario no hace nada en 3.5s
    </script>
